[pytest]
testpaths =
    tests/unit
    tests/integration
    tests/ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage flags deliberately live in CI, not here. With --cov in
# addopts, `pytest` refuses to start unless pytest-cov is installed —
# the error is "unrecognized arguments: --cov=...", which reads like a
# broken config rather than a missing plugin, and it stops anyone
# running the suite in a plain environment. The workflow passes --cov
# explicitly on every run, so coverage reporting is unchanged.
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI tests
    slow: Slow running tests
